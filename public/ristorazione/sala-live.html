<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sala Live</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.dev.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>html,body{margin:0;background:#05070A;color:#fff} .g{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12)}</style></head><body><div id="root"></div><script type="text/babel">
const {useState,useMemo,useRef}=React;const {motion,AnimatePresence}=Motion;
const ST={free:{s:'rgba(255,255,255,.28)',l:'Libero'},occ:{s:'#3DDC84',l:'Occupato'},bill:{s:'#FF3B30',l:'Conto'},vip:{s:'#00D9FF',l:'VIP'}};
const META={1:'occ',2:'free',3:'bill',4:'occ',5:'free',6:'vip',7:'occ',8:'occ',9:'free',10:'occ',11:'vip',12:'free',13:'occ',14:'bill',15:'occ',16:'free',17:'occ',18:'free',19:'occ',20:'bill',21:'vip',22:'occ'};
const NAMES={1:'Bianchi',3:'Verdi',4:'Neri',6:'Rossi',7:'Ferrari',8:'Costa',10:'Gallo',11:'Moretti',13:'Fontana',14:'Marini',15:'Azienda Luce',17:'Greco',19:'Sala',20:'Pellegrini',21:'De Luca',22:'Conte'};
function App(){
 const tables=useMemo(()=>Array.from({length:22},(_,i)=>({id:i+1,x:54+(i%6)*74,y:64+Math.floor(i/6)*74,st:META[i+1],guest:NAMES[i+1]||'—',bill:[64,96,189,210,420,156,310,640][i%8]})),[]);
 const [open,setOpen]=useState(null); const t=tables.find(x=>x.id===open);
 const occ=tables.filter(x=>x.st!=='free').length;
 return (<section className="min-h-screen p-6">
 <p className="text-[11px] tracking-[0.28em] uppercase text-cyan-300">Mente Locale · Sala</p>
 <h1 className="text-4xl font-bold mt-2">SALA LIVE</h1>
 <p className="text-white/60 mt-2">Controlli 22 tavoli dal telefono. Senza urlare.</p>
 <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-6">{[['22','tavoli'],[String(occ),'occupati'],['48','coperti'],['€2.430','incasso']].map(([v,l])=>(<div key={l} className="g rounded-2xl p-3"><div className="font-mono text-xl text-cyan-300">{v}</div><div className="text-[10px] uppercase text-white/40">{l}</div></div>))}</div>
 <div className="g rounded-3xl mt-5 overflow-hidden">
 <svg viewBox="0 0 500 360" className="w-full">
 {tables.map(tb=>(<g key={tb.id} className="cursor-pointer" onClick={()=>setOpen(tb.id)}>
 <circle cx={tb.x} cy={tb.y} r="26" fill="url(#gl)" stroke={ST[tb.st].s} strokeWidth="1.6"/>
 <ellipse cx={tb.x-8} cy={tb.y-10} rx="10" ry="5" fill="rgba(255,255,255,.2)"/>
 <text x={tb.x} y={tb.y+4} textAnchor="middle" fill="#fff" fontSize="11">{tb.id}</text></g>))}
 <defs><radialGradient id="gl" cx="35%" cy="30%"><stop offset="0%" stopColor="rgba(255,255,255,.22)"/><stop offset="100%" stopColor="rgba(255,255,255,.03)"/></radialGradient></defs>
 </svg></div>
 <div className="g rounded-3xl p-5 mt-5"><div className="text-[11px] uppercase text-white/40 mb-3">Vendite live</div>
 <div className="flex items-end gap-2 h-28">{[180,420,310,260,540,890,720,480,210].map((v,i)=>(<div key={i} className="flex-1 bg-gradient-to-t from-violet-500 to-cyan-300 rounded-full" style={{height:(v/890)*100+'%'}}/>))}</div></div>
 <AnimatePresence>{t && <motion.aside initial={{x:360}} animate={{x:0}} exit={{x:360}} className="fixed top-0 right-0 h-full w-full max-w-sm g p-6 z-50">
 <button className="text-white/40" onClick={()=>setOpen(null)}>×</button>
 <div className="text-3xl font-bold mt-2">T{t.id}</div>
 <div className="text-white/60">{t.guest} · {ST[t.st].l}</div>
 {t.st!=='free' && <div className="mt-4 space-y-2 text-sm"><div className="g rounded-xl p-3">Conto <b className="text-cyan-300">€{t.bill}</b></div><div className="g rounded-xl p-3">Allergia crostacei · LTV €3400</div><div>20:00 Aperitivo</div><div className="text-red-400">20:32 Primo IN PREP 08:23</div><button className="w-full mt-4 rounded-xl py-3 bg-cyan-400 text-black font-bold" onClick={()=>setOpen(null)}>Stampa conto</button></div>}
 </motion.aside>}</AnimatePresence>
 </section>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
